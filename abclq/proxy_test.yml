name: Proxy Test Automation

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 时间 0 点运行一次
  workflow_dispatch: # 手动触发任务（可选）
  
jobs:
  proxy-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' # 指定 Python 版本

    - name: Install dependencies
      run: |
        pip install pysocks requests

    - name: Run proxy test
      run: python proxy_test.py # 运行你的代理测试脚本
