name: Proxy Test Automation

on:
  schedule:
    # 每天 UTC 时间 00:00 运行 (调整时区可以修改 cron 表达式)
    - cron: "0 0 * * *"
  workflow_dispatch: # 手动触发支持

jobs:
  run_proxy_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.9  # 使用 Python 版本

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pysocks  # 安装依赖

    - name: Run proxy test script
      run: |
        python proxy_test.py
